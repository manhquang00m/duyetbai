<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d1307a" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <title>Chưa kết nối được — Threads Affiliate</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #f6f7f9; color: #111827;
      }
      .card {
        max-width: 420px; width: 100%; text-align: center; background: #fff;
        border: 1px solid #e5e7eb; border-radius: 16px; padding: 32px 24px;
      }
      img { width: 64px; height: 64px; }
      h1 { font-size: 18px; margin: 16px 0 6px; }
      p { margin: 0 0 6px; color: #6b7280; font-size: 14px; line-height: 1.5; }
      ol { text-align: left; color: #374151; font-size: 14px; line-height: 1.6; padding-left: 20px; margin: 14px 0 20px; }
      button {
        font: inherit; font-weight: 600; color: #fff; background: #d1307a; border: 0;
        border-radius: 10px; padding: 10px 20px; cursor: pointer;
      }
      button:hover { background: #b82868; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1115; color: #e5e7eb; }
        .card { background: #171a21; border-color: #2a2f3a; }
        p { color: #9ca3af; }
        ol { color: #d1d5db; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>Chưa kết nối được tới app</h1>
      <p>Server Threads Affiliate đang tắt hoặc mất mạng.</p>
      <ol>
        <li>Trên máy chạy app, mở <strong>Thread Affiliate Launcher</strong> và bấm <strong>Start</strong>.</li>
        <li>Nếu mở qua link devtunnel: kiểm tra launcher đang <strong>Forward</strong>.</li>
      </ol>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
